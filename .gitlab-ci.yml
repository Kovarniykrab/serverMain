image: docker:git

services:
  - docker:dind

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - docker info
    - echo "${{ secrets.GITHUB_TOKEN }}" | docker login --username github-ci-token --password-stdin ${{ env.REGISTRY }}
    - docker build ./ --tag ${{ github.repository }}:${{ github.repository }}
    - docker push ${{ github.repository }}:latest
  only:
    - main

